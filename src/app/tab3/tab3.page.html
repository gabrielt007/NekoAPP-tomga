<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Autoevaluación</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  @for (item of preguntas; track item.q) {
    <ion-card>
      <ion-card-header>
        <ion-card-title style="font-size: 1.1rem; font-weight: bold; color: var(--ion-color-primary);">
          {{ item.q }}
        </ion-card-title>
      </ion-card-header>
      
      <ion-card-content style="text-align: justify;">
        {{ item.a }}
      </ion-card-content>
    </ion-card>
  }

</ion-content>
