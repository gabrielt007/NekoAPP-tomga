<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Listado remoto
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <ion-card color="light">
    <ion-card-header>
      <ion-card-title>Neko Card</ion-card-title>
      <ion-card-subtitle>Tarjetas con información</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <img alt="NekoImage" src="https://ionicframework.com/docs/img/demos/card-media.png" />
      <p>Here's a small text description for the card content. Nothing more, nothing less.</p>
    </ion-card-content>

    <ion-button fill="clear" click="getNekoStatic()">Image</ion-button>
    <ion-button fill="clear">Gift</ion-button>
  </ion-card>
</ion-content>
